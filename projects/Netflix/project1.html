<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Netflix Clone</title>
    <link rel="stylesheet" href="Project1.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <img class="logo" src="logo.png" alt="Netflix" />
      </header>

      <main class="login-wrap">
        <form class="login-card" id="loginForm" novalidate>
          <h1 class="login-card__title">Sign In</h1>

          <div class="field">
            <input
              class="field__input"
              type="email"
              id="email"
              name="user-sign-in"
              placeholder=" "
              autocomplete="email"
              required
            />
            <label class="field__label" for="email">Email or phone number</label>
            <p class="field__error" id="emailError" role="alert"></p>
          </div>

          <div class="field">
            <input
              class="field__input"
              type="password"
              id="password"
              name="user-password"
              placeholder=" "
              autocomplete="current-password"
              required
              minlength="6"
            />
            <label class="field__label" for="password">Password</label>
            <button type="button" class="field__toggle" id="togglePassword" aria-label="Show password">Show</button>
            <p class="field__error" id="passwordError" role="alert"></p>
          </div>

          <button class="btn-submit" type="submit" id="submitBtn">
            <span class="btn-submit__label">Sign In</span>
          </button>

          <p class="hash-status" id="hashStatus" aria-live="polite"></p>

          <div class="row-options">
            <label class="remember">
              <input class="remember__check" type="checkbox" name="remember" />
              Remember me
            </label>
            <a class="need-help" href="#">Need help?</a>
          </div>

          <div class="signup-box">
            <h2 class="signup-box__lead">New to Netflix? <a href="#" class="signup-box__link">Sign up now.</a></h2>
          </div>

          <p class="recaptcha-note">
            This page is protected by Google reCAPTCHA to ensure you're not a
            bot. <a class="recaptcha-note__link" href="#">Learn more.</a>
          </p>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
